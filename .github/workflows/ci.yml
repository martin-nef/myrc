name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: make check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shells and tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bash dash zsh \
            shellcheck \
            bats \
            rsync \
            make

      - name: Install shfmt
        env:
          SHFMT_VERSION: v3.8.0
        run: |
          curl -fsSL -o /tmp/shfmt \
            "https://github.com/mvdan/sh/releases/download/${SHFMT_VERSION}/shfmt_${SHFMT_VERSION}_linux_amd64"
          sudo install -m 0755 /tmp/shfmt /usr/local/bin/shfmt
          shfmt --version

      - name: Print tool versions
        run: |
          bash --version | head -n1
          dash --help 2>&1 | head -n1 || true
          zsh --version
          shellcheck --version | head -n2
          bats --version
          shfmt --version

      - name: Run checks
        run: make check
